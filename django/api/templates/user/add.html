{% extends 'user/base.html' %}
{% block content %}
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="row">
        {% for field in form %}
        <div class="col-md-6">
            <div class="form-group mb-4">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="d-flex justify-content-between mt-5">
        <a href="{% url 'getAllUsers' %}" class="btn btn-outline-secondary btn-lg">Retour</a>
        <button type="submit" class="btn btn-success btn-lg">Créer l'utilisateur</button>
    </div>
</form>
{% endblock %}
